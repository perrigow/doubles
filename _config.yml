# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Louis Stoio Memorial Doubles
# email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Website for the Louis Stoio Memorial Doubles bowling league.
# baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
github_username: perrigow
theme_path: /themes/lsmd/
defaults:
  - scope:
      type: "pages"
    values:
      layout: default
  - scope:
      type: "downloads"
    values:
      title: Downloads
      permalink: /:collection/:name
      layout: downloads
  - scope:
      type: "sidepots"
    values:
      title: Sidepots
      permalink: /:collection/:name
      layout: sidepots
  - scope:
      path: assets/fetch
    values:
      fetch_file: true
  - scope:
      path: assets/seasons/*/misc
    values:
      miscellaneous_pdf: true
  - scope:
      path: assets/seasons/*/sidepots
    values:
      sidepots_pdf: true
  - scope:
      path: assets/seasons/*/standings/png
    values:
      standings_png: true
  - scope:
      path: assets/seasons/*/standings/pdf
    values:
      standings_pdf: true

collections:
  downloads:
    output: true
  sidepots:
    output: true

# Build settings
markdown: kramdown
theme: null
# plugins:
#   - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - CNAME
  - LICENSE
  - README.md
